<main class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="iniciarSesion()">
    <h1>Iniciar sesión</h1>
    @if (expirada() === '1') {
      <div class="aviso-expirada">Tu sesión expiró. Ingresa nuevamente para continuar.</div>
    }
    @if (error()) {
      <div class="alerta">{{ error() }}</div>
    }
    <label for="username">Usuario</label>
    <input id="username" formControlName="username" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password">
    <button class="btn btn-primary" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</main>
