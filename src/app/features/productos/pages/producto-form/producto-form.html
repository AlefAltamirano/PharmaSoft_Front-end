<section class="page">
  <h2>{{ esEdicion() ? 'Editar producto' : 'Nuevo producto' }}</h2>

  @if (error()) {
    <div class="alerta">{{ error() }}</div>
  }

  @if (!cargando() && !opciones().length) {
    <div class="alerta">No hay categorías activas. <a routerLink="/categorias/nuevo">Registrar una categoría</a> para continuar.</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" class="card formulario">
    <label>
      Nombre
      <input class="input" formControlName="nombre" />
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
        <small class="error">El nombre es obligatorio y debe tener entre 3 y 150 caracteres.</small>
      }
      @if (erroresServidor()['nombre']; as mensaje) {
        <small class="error">{{ mensaje }}</small>
      }
    </label>

    <label>
      Precio
      <input class="input" type="number" step="0.01" formControlName="precio" />
      @if (form.controls.precio.touched && form.controls.precio.invalid) {
        <small class="error">El precio debe ser mayor o igual a 0.01.</small>
      }
    </label>

    <label>
      Stock
      <input class="input" type="number" step="1" formControlName="stock" />
      @if (form.controls.stock.touched && form.controls.stock.invalid) {
        <small class="error">El stock es obligatorio y debe ser un entero mayor o igual a 0.</small>
      }
    </label>

    <label>
      Categoría
      <select class="input" formControlName="categoriaId">
        <option [ngValue]="0">Seleccione una categoría</option>
        @for (categoria of opciones(); track categoria.id) {
          <option [ngValue]="categoria.id">{{ categoria.etiqueta }}</option>
        }
      </select>
      @if (form.controls.categoriaId.touched && form.controls.categoriaId.invalid) {
        <small class="error">Seleccione una categoría.</small>
      }
      @if (categoriaInactiva()) {
        <small class="error">La categoría seleccionada está inactiva.</small>
      }
    </label>

    <label class="check">
      <input type="checkbox" formControlName="estado" /> Activo
    </label>

    <div class="acciones">
      <a routerLink="/productos" class="btn">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="guardando() || categoriaInactiva() || !opciones().length">
        {{ guardando() ? 'Guardando...' : (esEdicion() ? 'Actualizar' : 'Registrar') }}
      </button>
    </div>
  </form>
</section>
