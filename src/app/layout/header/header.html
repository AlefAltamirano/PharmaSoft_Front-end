<header class="header">
  <button type="button" class="btn-menu" aria-label="Mostrar u ocultar menú" (click)="toggleMenu.emit()">☰</button>
  <a routerLink="/inicio" class="marca">PharmaSoft</a>
  <nav class="menubar">
    <a routerLink="/inicio">Inicio</a>
    <a href="http://localhost:8080/swagger-ui.html" target="_blank" rel="noopener">API</a>
  </nav>
  @if (auth.sesion(); as sesion) {
    <span class="usuario">
      {{ sesion.nombreCompleto || sesion.username }} · {{ sesion.roles.join(', ') }}
      · Expira {{ sesion.expiraEn | date: 'HH:mm' }}
    </span>
    <a routerLink="/mi-cuenta" class="enlace-cuenta">Mi cuenta</a>
    <button type="button" class="btn-salir" (click)="cerrarSesion()">Cerrar sesión</button>
  }
</header>
