@if (authService.porVencer()) {
  <div class="aviso-sesion" role="status">
    <span>Su sesión vence en {{ authService.tiempoRestante() }}</span>
    <div class="acciones">
      <button type="button" class="btn btn-primary" (click)="cerrarSesion()">Cerrar sesión ahora</button>
      <button type="button" class="btn cerrar" aria-label="Ocultar aviso" (click)="ocultarAviso()">X</button>
    </div>
  </div>
}
